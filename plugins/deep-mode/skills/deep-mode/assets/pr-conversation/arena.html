<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deep-mode arena</title>
<style>
  :root { --bg: #111b14; --ink: #c9dbb0; --dim: #7d9672; --line: #26362a; --hi: #e0efc4; --sel: #1a291d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  main { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; padding: 16px; }
  #stage { display: flex; flex-direction: column; gap: 6px; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; outline: none; }
  #keys, #status { color: var(--dim); font-size: 12px; margin: 0; }
  #log { flex: 1 1 380px; max-width: 560px; min-width: 300px; overflow-y: auto; border-left: 1px solid var(--line); padding: 0 4px 0 14px; position: relative; }
  #log h2 { font-size: 13px; font-weight: normal; color: var(--hi); margin: 0 0 2px; }
  #log .title { margin: 0 0 10px; color: var(--dim); }
  #log .back { font: inherit; font-size: 12px; color: var(--dim); background: none; border: 1px solid var(--line); padding: 0 6px; margin: 0 8px 0 0; cursor: pointer; }
  #log .back:hover, #log .back:focus-visible { color: var(--hi); border-color: var(--dim); }
  #log a { color: var(--dim); }
  .turn { padding: 5px 8px; margin: 0 0 2px; border-left: 2px solid transparent; cursor: pointer; }
  .turn.active { background: var(--sel); border-left-color: var(--dim); }
  .turn .who { color: var(--hi); }
  .turn .who span { color: var(--dim); }
  .turn ul { margin: 2px 0 0; padding-left: 18px; }
  .turn li { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div id="stage">
    <canvas id="screen" width="256" height="192" tabindex="0" aria-label="8-bit replay of the bot conversation"></canvas>
    <p id="keys">Enter/Space/click: next &middot; B/Backspace: back &middot; A: auto &middot; L: latest &middot; Esc: threads</p>
    <p id="status"></p>
  </div>
  <section id="log" aria-label="Transcript"></section>
</main>
<script type="application/json" id="arena-data">__ARENA_DATA__</script>
<script>
(() => {
  'use strict';
  const W = 256, H = 192, COLS = 29, MAXPAGES = 3;
  const PAL = ['#e0efc4', '#a3c47a', '#4f7d4a', '#1d3324'];
  // font8x8_basic (Daniel Hepper, public domain): 128 glyphs, 8 rows each, least significant bit = leftmost pixel.
  const FONT = '__FONT_HEX__';
  // Own glyphs in unused control codes: 1 cursor, 2 down arrow, 3 pip, 4 empty pip, 5 failed pip, 6 up arrow.
  const EXTRA = { 1: [1, 3, 7, 15, 7, 3, 1, 0], 2: [0, 127, 62, 28, 8, 0, 0, 0], 3: [28, 62, 127, 127, 127, 62, 28, 0],
                  4: [28, 34, 65, 65, 65, 34, 28, 0], 5: [65, 34, 20, 8, 20, 34, 65, 0], 6: [0, 8, 28, 62, 127, 0, 0, 0] };

  const data = JSON.parse(document.getElementById('arena-data').textContent);
  const LIVE = !!data.live;
  const cv = document.getElementById('screen');
  const g = cv.getContext('2d');
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');

  const sheets = PAL.map(color => {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 8;
    const x = c.getContext('2d'); x.fillStyle = color;
    for (let ch = 0; ch < 128; ch++) {
      const rows = EXTRA[ch] || Array.from({ length: 8 }, (_, r) => parseInt(FONT.substr(ch * 16 + r * 2, 2), 16));
      rows.forEach((bits, r) => { for (let b = 0; b < 8; b++) if ((bits >> b) & 1) x.fillRect(ch * 8 + b, r, 1, 1); });
    }
    return c;
  });
  const sprites = {};
  for (const [name, rows] of Object.entries(data.sprites)) {
    const c = document.createElement('canvas'); c.width = 16; c.height = 16;
    const x = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((p, px) => { if (p !== '.') { x.fillStyle = PAL[+p]; x.fillRect(px, y, 1, 1); } }));
    sprites[name] = c;
  }

  const rect = (x, y, w, h, c) => { g.fillStyle = PAL[c]; g.fillRect(x, y, w, h); };
  function text(s, x, y, c = 3) {
    for (let i = 0; i < s.length; i++) {
      let k = s.charCodeAt(i); if (k > 127) k = 63;
      g.drawImage(sheets[c], k * 8, 0, 8, 8, x + i * 8, y, 8, 8);
    }
  }
  const textRight = (s, right, y, c) => text(s, right - s.length * 8, y, c);
  const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + '.' : s);
  const ascii = s => (s || '').replace(/[^\x20-\x7e]/g, '?');
  function frame(x, y, w, h) {
    rect(x, y, w, h, 0);
    rect(x + 2, y, w - 4, 1, 3); rect(x + 2, y + h - 1, w - 4, 1, 3);
    rect(x, y + 2, 1, h - 4, 3); rect(x + w - 1, y + 2, 1, h - 4, 3);
    rect(x + 1, y + 1, 1, 1, 3); rect(x + w - 2, y + 1, 1, 1, 3); rect(x + 1, y + h - 2, 1, 1, 3); rect(x + w - 2, y + h - 2, 1, 1, 3);
    rect(x + 3, y + 3, w - 6, 1, 2); rect(x + 3, y + h - 4, w - 6, 1, 2);
    rect(x + 3, y + 3, 1, h - 6, 2); rect(x + w - 4, y + 3, 1, h - 6, 2);
  }
  function platform(cx, cy, rx, ry) {
    for (let dy = -ry; dy <= ry; dy++) {
      const hw = Math.round(rx * Math.sqrt(1 - (dy / (ry + 0.5)) ** 2));
      rect(cx - hw, cy + dy, hw * 2, 1, dy === ry ? 2 : 1);
    }
  }
  const sprite = (name, x, y) => {
    g.imageSmoothingEnabled = false;
    g.drawImage(sprites[name] || sprites.author, Math.round(x), Math.round(y), 48, 48);
  };

  function splitLong(word, n) {  // paths and URLs break after a separator when one is near the end
    const out = [];
    while (word.length > n) {
      const head = word.slice(0, n);
      const k = Math.max(...['/', '.', ':', '-', '_', ',', '=', '&', '?'].map(c => head.lastIndexOf(c)));
      const at = k >= n / 2 ? k + 1 : n;
      out.push(word.slice(0, at)); word = word.slice(at);
    }
    return [...out, word];
  }
  function wrap(s, n) {
    const out = []; let line = '';
    for (let word of s.split(/\s+/).filter(Boolean)) {
      if (word.length > n) {
        if (line) { out.push(line); line = ''; }
        const parts = splitLong(word, n);
        out.push(...parts.slice(0, -1)); word = parts[parts.length - 1];
      }
      if (!line) line = word;
      else if (line.length + 1 + word.length <= n) line += ' ' + word;
      else { out.push(line); line = word; }
    }
    if (line) out.push(line);
    return out.length ? out : [''];
  }
  function pages(s) {
    let ls = wrap(ascii(s), COLS);
    if (ls.length > MAXPAGES * 2) {
      ls = ls.slice(0, MAXPAGES * 2);
      const last = ls[ls.length - 1];
      ls[ls.length - 1] = (last.length > COLS - 3 ? last.slice(0, COLS - 3) : last) + '...';
    }
    const out = [];
    for (let i = 0; i < ls.length; i += 2) out.push([ls[i], ls[i + 1] || '']);
    return out;
  }
  function buildBoxes(t) {
    const out = [];
    const add = (turn, s) => pages(s).forEach(p => out.push({ turn, lines: p }));
    t.intro.forEach(s => add(-1, s));
    t.turns.forEach((v, i) => v.lines.forEach(s => add(i, s)));
    t.outro.forEach(s => add(t.turns.length, s));
    return out;
  }

  let threads = data.threads, mode = 'menu', sel = 0, top = 0;
  let th = null, boxes = [], bi = 0, typed = 0, doneAt = 0, auto = false;
  let shown = -2, spkAt = 0, barFrom = 0, barTo = 0, barAt = 0, updated = data.generated;
  const ZERO = { open: 0, peak: 0, votes: [null, null, null], merged: false };

  const scoreAt = tu => {
    if (!th || tu < 0 || !th.turns.length) return { ...ZERO, merged: !!th && tu >= th.turns.length && th.state === 'merged' };
    if (tu >= th.turns.length) return { ...th.turns[th.turns.length - 1].after, merged: th.state === 'merged' };
    return th.turns[tu].after;
  };
  const speakerAt = tu => (!th || tu < 0 || !th.turns.length) ? null : th.turns[Math.min(tu, th.turns.length - 1)];
  const boxLen = b => b.lines[0].length + b.lines[1].length;
  const multiRepo = () => new Set(threads.map(t => t.repo)).size > 1;

  function openThread(i) {
    th = threads[i]; sel = i; mode = 'battle';
    boxes = buildBoxes(th); bi = 0; typed = 0; doneAt = 0; shown = -2; barFrom = barTo = 0;
    renderLog(); onBox(performance.now());
  }
  function toMenu() {
    if (threads.length < 2) return;
    mode = 'menu'; th = null; renderLog();
  }
  function onBox(now) {
    const tu = boxes[bi].turn;
    if (tu === shown) return;
    const prev = speakerAt(shown), next = speakerAt(tu);
    if (next && (!prev || prev.id !== next.id)) spkAt = now;
    barFrom = currentOpen(now); barTo = scoreAt(tu).open; barAt = now;
    shown = tu; highlight();
  }
  function go(i, now, full) {
    bi = Math.max(0, Math.min(boxes.length - 1, i));
    typed = full ? boxLen(boxes[bi]) : 0; doneAt = full ? now : 0;
    onBox(now);
  }
  function advance(now) {
    if (mode === 'menu') { if (threads.length) openThread(sel); return; }
    if (typed < boxLen(boxes[bi])) { typed = boxLen(boxes[bi]); doneAt = now; return; }
    if (bi < boxes.length - 1) go(bi + 1, now, false);
  }
  const back = now => { if (mode === 'battle' && bi > 0) go(bi - 1, now, true); };
  const firstBoxOf = tu => boxes.findIndex(b => b.turn === tu);
  function jumpLatest(now) {
    if (mode !== 'battle' || !th.turns.length) return;
    go(firstBoxOf(th.turns.length - 1), now, false);
  }
  const currentOpen = now => barFrom + (barTo - barFrom) * Math.min(1, (now - barAt) / 600);

  // ---------- drawing ----------
  function drawMenu(now) {
    rect(0, 0, W, H, 0);
    frame(0, 0, W, 24);
    text('CONVERSATIONS', 12, 8);
    textRight(String(threads.length), 244, 8, 2);
    frame(0, 24, W, 112);
    const rows = 4;
    if (sel < top) top = sel;
    if (sel >= top + rows) top = sel - rows + 1;
    threads.slice(top, top + rows).forEach((t, k) => {
      const i = top + k, y = 32 + k * 24;
      if (i === sel) text('\x01', 10, y);
      const label = t.label.toUpperCase();
      text(label, 22, y);
      text(`${t.turns.length} TURN${t.turns.length === 1 ? '' : 'S'}`, 22 + (label.length + 2) * 8, y, 2);
      textRight(t.state.toUpperCase(), 244, y);
      const title = (multiRepo() ? t.repo.split('/')[1] + ': ' : '') + t.title;
      text(cut(ascii(title), 27), 22, y + 10, 2);
    });
    if (top > 0) text('\x06', 226, 124);
    if (top + rows < threads.length) text('\x02', 238, 124);
    frame(0, 136, W, 56);
    text(threads.length ? 'Which conversation?' : 'No conversations yet.', 12, 150);
    text('ARROWS pick  ENTER watch', 12, 168, 2);
  }

  function drawBattle(now) {
    rect(0, 0, W, H, 0);
    const score = scoreAt(shown);
    // the thread, top: status bracket and sprite
    platform(204, 60, 34, 5);
    sprite(th.kind === 'pr' ? 'pr' : 'issue', 180, 10 + (Math.floor(now / 700) % 2));
    text(th.label.toUpperCase(), 12, 8);
    // a PR's state fits beside its label; an issue's longer label puts it on the vote row, which issues don't use
    if (score.merged || (shown >= th.turns.length && th.state !== 'open'))
      textRight(score.merged ? 'MERGED' : th.state.toUpperCase(), 140, th.kind === 'pr' ? 8 : 34, 2);
    text('OPEN', 12, 22);
    const open = currentOpen(now), frac = score.peak ? Math.max(0, Math.min(1, open / score.peak)) : 0;
    rect(46, 22, 94, 7, 3); rect(47, 23, 92, 5, 0);
    if (frac > 0) rect(48, 24, Math.max(1, Math.round(90 * frac)), 3, frac > 0.5 ? 3 : 2);
    text(`${Math.round(open)}/${score.peak}`, 12, 34, 2);
    if (th.kind === 'pr') {
      text('VOTE', 76, 34, 2);
      score.votes.forEach((v, i) => text(v === 'PASS' ? '\x03' : v === 'FAIL' ? '\x05' : '\x04', 112 + i * 10, 34));
    }
    rect(6, 18, 1, 26, 3); rect(6, 44, 138, 1, 3); rect(144, 43, 1, 1, 3); rect(145, 42, 1, 1, 3);
    // the speaker, bottom: sprite sliding in and its status bracket
    const v = speakerAt(shown);
    platform(48, 130, 34, 5);
    if (v) {
      const k = Math.min(1, (now - spkAt) / 260), ease = 1 - (1 - k) ** 3;
      sprite(v.kind, -48 + 72 * ease, 82 - (k >= 1 && Math.floor(now / 500) % 2 ? 1 : 0));
      // name, then lens or agent, then model, stacked up from the head line
      const rows = [[v.name, 3], [v.lens || v.agent || '', 2], [(v.model || '').split('/').pop(), 2]].filter(r => r[0]);
      rows.forEach(([s, c], i) => text(cut(ascii(s), 16), 116, 100 - (rows.length - 1 - i) * 12, c));
      const head = /^[0-9a-f]{7,}$/.test(v.head) ? '@' + v.head.slice(0, 7) : cut(ascii(v.head || ''), 10);
      text(head, 116, 112, 2);
      textRight((v.time || '').slice(11, 16), 244, 112, 2);
      const y0 = 100 - (rows.length - 1) * 12 - 4;
      rect(250, y0, 1, 122 - y0, 3); rect(110, 122, 141, 1, 3); rect(109, 121, 1, 1, 3); rect(108, 120, 1, 1, 3);
    }
    // turn counter and modes, between the two sides
    const tcount = th.turns.length;
    text(`TURN ${Math.max(0, Math.min(shown + 1, tcount))}/${tcount}`, 8, 54, 2);
    if (LIVE) { rect(7, 65, 34, 10, 2); text('LIVE', 8, 66, 0); }
    if (auto) { rect(LIVE ? 47 : 7, 65, 34, 10, 3); text('AUTO', LIVE ? 48 : 8, 66, 0); }
    // dialog
    frame(0, 136, W, 56);
    const b = boxes[bi], n = Math.floor(typed);
    text(b.lines[0].slice(0, n), 12, 148);
    text(b.lines[1].slice(0, Math.max(0, n - b.lines[0].length)), 12, 168);
    if (typed >= boxLen(b) && bi < boxes.length - 1 && Math.floor(now / 400) % 2) text('\x02', 236, 178);
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(100, now - last); last = now;
    if (mode === 'battle' && th) {
      const len = boxLen(boxes[bi]);
      if (typed < len) { typed = Math.min(len, typed + dt * 0.06); if (typed >= len) doneAt = now; }
      else if (auto && bi < boxes.length - 1 && now - doneAt > 1000 + len * 25) go(bi + 1, now, false);
      drawBattle(now);
    } else drawMenu(now);
    requestAnimationFrame(tick);
  }

  // ---------- transcript ----------
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function link(href, txt) {
    const a = el('a', null, txt);
    if (/^https:\/\/github\.com\//.test(href || '')) { a.href = href; a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }
  function renderLog() {
    logEl.replaceChildren();
    if (mode === 'menu' || !th) {
      logEl.append(el('h2', null, 'Conversations'));
      threads.forEach((t, i) => {
        const d = el('div', 'turn' + (i === sel ? ' active' : ''));
        const who = el('div', 'who', `${t.label} `); who.append(el('span', null, `${t.state} · ${t.turns.length} turns · ${t.repo}`));
        d.append(who, el('div', null, t.title), link(t.url, t.url));
        d.onclick = e => { if (e.target.tagName !== 'A') openThread(i); };
        logEl.append(d);
      });
      return;
    }
    const head = el('h2');
    if (threads.length > 1) {
      const back = el('button', 'back', '< threads');
      back.type = 'button'; back.title = 'Back to the thread list (Esc)';
      back.onclick = () => { toMenu(); cv.focus(); };
      head.append(back);
    }
    head.append(`${th.label} · ${th.state} · ${th.repo}`);
    logEl.append(head);
    const title = el('p', 'title'); title.append(link(th.url, th.title || th.url)); logEl.append(title);
    th.turns.forEach((v, i) => {
      const d = el('div', 'turn'); d.dataset.turn = i;
      const who = el('div', 'who', v.voice + ' ');
      who.append(el('span', null, `${(v.time || '').slice(11, 16)}${v.head ? ' @ ' + v.head : ''} `), link(v.html_url, '#' + v.id));
      const ul = el('ul'); (v.gist || []).forEach(line => ul.append(el('li', null, line)));
      d.append(who, ul);
      d.onclick = e => { if (e.target.tagName !== 'A') go(firstBoxOf(i), performance.now(), false); };
      logEl.append(d);
    });
    if (!th.turns.length) logEl.append(el('p', 'title', 'No bot turns yet.'));
    highlight();
  }
  function highlight() {
    if (mode !== 'battle') return;
    logEl.querySelectorAll('.turn.active').forEach(e => e.classList.remove('active'));
    const cur = logEl.querySelector(`.turn[data-turn="${Math.min(shown, th.turns.length - 1)}"]`);
    if (!cur) return;
    cur.classList.add('active');
    if (cur.offsetTop < logEl.scrollTop || cur.offsetTop + cur.offsetHeight > logEl.scrollTop + logEl.clientHeight)
      logEl.scrollTop = cur.offsetTop - 8;
  }
  function setStatus(extra) {
    const when = new Date(updated).toLocaleTimeString();
    statusEl.textContent = (LIVE ? `live · updated ${when} · polls every 15 s` : `snapshot of ${when}`) + (extra ? ` · ${extra}` : '') +
      ((data.errors || []).length ? ` · ${data.errors.length} thread(s) failed to load` : '');
  }

  // ---------- live updates ----------
  function boxKey(t, bx, i) {
    const tu = bx[i].turn;
    const key = tu < 0 ? 'intro' : tu >= t.turns.length ? 'outro' : t.turns[tu].id;
    let ord = 0;
    for (let j = i - 1; j >= 0 && bx[j].turn === tu; j--) ord++;
    return [key, ord];
  }
  function apply(next) {
    data.errors = next.errors; updated = next.generated;
    const was = th, wasMenu = mode === 'menu';
    threads = next.threads;
    if (was) {
      const i = threads.findIndex(t => t.url === was.url);
      if (i < 0) { threads = [was, ...threads]; sel = 0; return; }
      const [key, ord] = boxKey(was, boxes, bi), oldTurns = was.turns.length, wasTyped = typed;
      th = threads[i]; sel = i;
      const changed = th.turns.length !== oldTurns || JSON.stringify(th.turns.map(v => v.lines)) !== JSON.stringify(was.turns.map(v => v.lines));
      boxes = buildBoxes(th);
      let at;
      if (key === 'outro' && th.turns.length > oldTurns) at = firstBoxOf(oldTurns);
      else {
        const turnIdx = key === 'intro' ? -1 : key === 'outro' ? th.turns.length : th.turns.findIndex(v => v.id === key);
        const first = firstBoxOf(turnIdx);
        at = first < 0 ? Math.min(bi, boxes.length - 1) : Math.min(first + ord, boxes.length - 1);
      }
      const now = performance.now();
      if (at !== bi || changed) { bi = at; typed = key === 'outro' && th.turns.length > oldTurns ? 0 : Math.min(wasTyped, boxLen(boxes[bi])); shown = -3; onBox(now); }
      if (changed) renderLog();
    } else if (wasMenu) { sel = Math.min(sel, Math.max(0, threads.length - 1)); renderLog(); }
  }
  async function poll() {
    try {
      const r = await fetch('/api/threads', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      apply(await r.json()); setStatus();
    } catch (err) { setStatus('poll failed: ' + err.message); }
  }

  // ---------- input and layout ----------
  window.addEventListener('keydown', e => {
    const now = performance.now(), k = e.key;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // A focused link or button keeps its own activation keys; every other key still drives the arena.
    if ((k === 'Enter' || k === ' ') && e.target instanceof Element && e.target.closest('a, button')) return;
    let used = true;
    if (k === 'Enter' || k === ' ' || k === 'z' || k === 'Z' || k === 'ArrowRight') advance(now);
    else if (k === 'Backspace' || k === 'b' || k === 'B' || k === 'x' || k === 'X' || k === 'ArrowLeft') back(now);
    else if (k === 'a' || k === 'A') auto = !auto;
    else if (k === 'Escape') toMenu();
    else if (k === 'l' || k === 'L' || k === 'End') jumpLatest(now);
    else if (k === 'Home') { if (mode === 'battle') go(0, now, false); }
    else if (mode === 'menu' && k === 'ArrowDown') { sel = Math.min(threads.length - 1, sel + 1); renderLog(); }
    else if (mode === 'menu' && k === 'ArrowUp') { sel = Math.max(0, sel - 1); renderLog(); }
    else used = false;
    if (used) e.preventDefault();
  });
  cv.addEventListener('click', e => {
    const now = performance.now();
    cv.focus();
    if (mode === 'menu') {
      const y = e.offsetY / cv.clientHeight * H, row = Math.floor((y - 30) / 24);
      if (y >= 30 && y < 126 && top + row < threads.length) {
        if (top + row === sel) openThread(sel); else { sel = top + row; renderLog(); }
      }
    } else advance(now);
  });
  function fit() {
    const dpr = window.devicePixelRatio || 1, wide = innerWidth >= 1040;
    const availW = wide ? innerWidth - 32 - 20 - 400 : innerWidth - 32, availH = innerHeight - 90;
    const s = Math.max(1, Math.floor(Math.min(availW / W, availH / H) * dpr));
    cv.style.width = (W * s / dpr) + 'px'; cv.style.height = (H * s / dpr) + 'px';
    logEl.style.height = wide ? (H * s / dpr) + 'px' : '';
  }
  window.addEventListener('resize', fit);
  fit();
  if (threads.length === 1) openThread(0); else renderLog();
  setStatus();
  if (LIVE) setInterval(poll, 15000);
  requestAnimationFrame(tick);
  cv.focus();
})();
</script>
</body>
</html>
