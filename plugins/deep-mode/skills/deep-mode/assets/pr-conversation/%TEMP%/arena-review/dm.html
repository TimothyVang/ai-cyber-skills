ent check test -f result (via check.sh) and a fake omp that changes a file each iteration and creates result at iteration 5: the goal was met at iteration 5 with stall_after 3. A fake that does nothing still stopped with exit 3 after 3 iterations. git status in the test repo stayed clean.", "F3 - New function cost_cap() requires a positive max_cost_usd when the harness is omp or claude. This is checked for both check and run, and after any --harness override is applied. harness_command now always passes --max-cost or --max-budget-usd. Tested: omp and claude without a cost were refused with the matching flag named; codex was still allowed because it has no cost flag.", "F4 - When the harness exits nonzero, loop.py writes the trail row, runs the check once (so an already-met goal still returns 0), then stops with the new exit code 5 and names the log file. The docstring and playbook list exit 5. Tested with a fake omp that exits 3: output was 'iteration 1: harness exit 3, check exit 1' followed by the harness-failed message, and the process exited 5.", "F5 - Each run gets an id made of a timestamp and the process id. Logs are written as \u003crun>-iteration-N.log and opened in mode 'x', so an existing log is never overwritten. trail.tsv has a new run column. Tested: two runs of the same goal produced four separate logs, and the trail rows were labelled with the two run ids.", "F6 - With run --dry-run, loop.py now prints the harness command right after validating the goal file. It no longer runs the check and creates no .scratch folders. Tested with the check touch side_effect; false: the command was printed, exit was 0, the side_effect file was not created, and no .scratch folder appeared."], "after": {"open": 0, "peak": 6, "votes": [null, null, null], "merged": false}}, {"id": 6810174936, "html_url": "https://github.com/TimothyVang/deep-mode/pull/32#issuecomment-6810174936", "time": "2026-11-11T23:57:59Z", "role": "reviewer", "voice": "reviewer · omp (openai-codex/gp s set and the issue isn't implemented, so a retry with no triggering comment still implements. handle() clears the flag only when the run won't be retried. Verified: test_wants_implementation now covers a retry on another person's issue (true) and an already-implemented issue (false).", "fixed F7 in bca150b — On first sight of a PR opened before the install, repo_cycle reads the head commit's committer date. pr_reasons counts the head as new if that date is after the start time, and only an older-dated head is recorded as backlog; any push after that is new whatever its dates. Remaining case: an old-dated commit pushed after install but before the first poll. GitHub gives no push time for normal pushes, and this repo's events API had no push events among its last 100. The install cycle polls every repo at once, so this only affects PRs first seen later. Verified: test_backlog_pr_first_seen_late_with_post_install_head_is_new; a real head-commit date lookup returned 2026-11-11T21:47:59Z, the same format as the start time.", "fixed F9 in bca150b — When open_issues finds an unanswered linked issue in the same repo, it sets answerAll on that issue's state. issue_reasons then treats any human comment there as a trigger, so the issue conversation answers it and the PR waiting in awaiting-issues can merge on a later cycle. handle() clears the flag after a successful issue run. Verified: test_linked_issue_waiting_on_a_merge_answers_anyone (no trigger without the flag, one with it).", "fixed F11 in bca150b — Before reusing an existing origin/\u003cbrand>/issue-\u003cn> branch, implement() lists origin/\u003cdefault>..origin/\u003cbranch> and refuses unless every commit is one the bot made itself (recorded when the bot pushes). Otherwise it posts that the branch holds commits the bots didn't make, returns blocked, and never starts the write-enabled author. Verified: check.py OK and tests pass. Not exercised in a live cycle.", "fixed F12 in bca150b — Identity.is_ours counts a comment as the bots' only when the app posted it, or the owner's account posted it with the bot signature (the no-app mode). A signature from anyone else is a human comment, so a forged reply can't make a linked issue look answered. Verified: test_signature_counts_only_from_the_app_or_the_owner, where a stranger's signed comment is not ours and unanswered() stays true."], "name": "AUTHOR", "lines": ["AUTHOR returns!", "The head moved to bca150b.", "AUTHOR used FIX! x6 (in bca150b)", "F5 - panel() now calls require_own() before the verifier worktrees are created and before any write-enabled verifier runs. require_own re-reads the PR's author, fork status and head plus its commits and push access from GitHub, and stops with a Blocked message if the head moved or fails the ownership gate. So verifiers, like the author, run only on a head re-checked just before. Verified: python scripts/check.py OK; 29 unit tests pass. Not exercised in a live cycle.", "F6 - IssueConversation.run records item['implementRequested'] once wants_implementation is true, before any agent turn. wants_implementation returns true while that flag is set and the issue isn't implemented, so a retry with no triggering comment still implements. handle() clears the flag only when the run won't be retried. Verified: test_wants_implementation now covers a retry on another person's issue (true) and an already-implemented issue (false).", "F7 - On first sight of a PR opened before the install, repo_cycle reads the head commit's committer date. pr_reasons counts the head as new if that date is after the start time, and only an older-dated head is recorded as backlog; any push after that is new whatever its dates. Remaining case: an old-dated commit pushed after install but before the first poll. GitHub gives no push time for normal pushes, and this repo's events API had no push events among its last 100. The install cycle polls every repo at once, so this only affects PRs first seen later. Verified: test_backlog_pr_first_seen_late_with_post_install_head_is_new; a real head-commit date lookup returned 2026-11-11T21:47:59Z, the same format as the start time.", "F9 - When open_issues finds an unanswered linked issue in the same repo, it sets answerAll on that issue's state. issue_reasons then treats any human comment there as a trigger, so the issue conversation answers it and the PR waiting in awaiting-issues can merge on a later cycle. handle() clears the flag after a successful issue run. Verified: test_linked_issue_waiting_on_a_merge_answers_anyone (no trigger without the flag, one with it).", "F11 - Before reusing an existing origin/\u003cbrand>/issue-\u003cn> branch, implement() lists origin/\u003cdefault>..origin/\u003cbranch> and refuses unless every commit is one the bot made itself (recorded when the bot pushes). Otherwise it posts that the branch holds commits the bots didn't make, returns blocked, and never starts the write-enabled author. Verified: check.py OK and tests pass. Not exercised in a live cycle.", "F12 - Identity.is_ours counts a comment as the bots' only when the app posted it, or the owner's account posted it with the bot signature (the no-app mode). A signature from anyone else is a human comment, so a forged reply can't make a linked issue look answered. Verified: test_signature_counts_only_from_the_app_or_the_owner, where a stranger's signed comment is not ours and unanswered() stays true."], "after": {"open": 0, "peak": 10, "votes": [null, null, null], "merged": false}}, {"id": 6807938200, "html_url": "https://github.com/TimothyVang/deep-mode/pull/19#issuecomment-6807938200", "time": "2026-11-11T21:53:42Z", "role": "reviewer", "voice": "reviewer · omp (openai-codex/gpt-6.1-terra)", "kind": "reviewer", "number": null, "lens": null, "agent": "omp", "model": "openai-codex/gpt-6.1-terra", "head": "bca150b", "gist": ["P1: plugins/deep-mode/skills/deep-mode/assets/github-app/bot.py:1141 — A retry retains the decision to implement but can lose the o       text(cut(ascii(title), 27), 22, y + 10, 2);
    });
    if (top > 0) text('\x06', 226, 124);
    if (top + rows < threads.length) text('\x02', 238, 124);
    frame(0, 136, W, 56);
    text(threads.length ? 'Which conversation?' : 'No conversations yet.', 12, 150);
    text('ARROWS pick  ENTER watch', 12, 168, 2);
  }

  function drawBattle(now) {
    rect(0, 0, W, H, 0);
    const score = scoreAt(shown);
    // the thread, top: status bracket and sprite
    platform(204, 60, 34, 5);
    sprite(th.kind === 'pr' ? 'pr' : 'issue', 180, 10 + (Math.floor(now / 700) % 2));
    text(th.label.toUpperCase(), 12, 8);
    if (score.merged || (shown >= th.turns.length && th.state !== 'open'))
      textRight(score.merged ? 'MERGED' : th.state.toUpperCase(), 140, 8, 2);
    text('OPEN', 12, 22);
    const open = currentOpen(now), frac = score.peak ? Math.max(0, Math.min(1, open / score.peak)) : 0;
    rect(46, 22, 94, 7, 3); rect(47, 23, 92, 5, 0);
    if (frac > 0) rect(48, 24, Math.max(1, Math.round(90 * frac)), 3, frac > 0.5 ? 3 : 2);
    text(`${Math.round(open)}/${score.peak}`, 12, 34, 2);
    if (th.kind === 'pr') {
      text('VOTE', 76, 34, 2);
      score.votes.forEach((v, i) => text(v === 'PASS' ? '\x03' : v === 'FAIL' ? '\x05' : '\x04', 112 + i * 10, 34));
    }
    rect(6, 18, 1, 26, 3); rect(6, 44, 138, 1, 3); rect(144, 43, 1, 1, 3); rect(145, 42, 1, 1, 3);
    // the speaker, bottom: sprite sliding in and its status bracket
    const v = speakerAt(shown);
    platform(48, 130, 34, 5);
    if (v) {
      const k = Math.min(1, (now - spkAt) / 260), ease = 1 - (1 - k) ** 3;
      sprite(v.kind, -48 + 72 * ease, 82 - (k >= 1 && Math.floor(now / 500) % 2 ? 1 : 0));
      // name, then lens or agent, then model, stacked up from the head line
      const rows = [[v.name, 3], [v.lens || v.agent || '', 2], [(v.model || '').split('/').pop(), 2]].filter(r => r[0]);
      rows.forEach(([s, c], i) => text(cut(ascii(s), 16), 116, 100 - (rows.length - 1 - i) * 12, c));
      const head = /^[0-9a-f]{7,}$/.test(v.head) ? '@' + v.head.slice(0, 7) : cut(ascii(v.head || ''), 10);
      text(head, 116, 112, 2);
      textRight((v.time || '').slice(11, 16), 244, 112, 2);
      const y0 = 100 - (rows.length - 1) * 12 - 4;
      rect(250, y0, 1, 122 - y0, 3); rect(110, 122, 141, 1, 3); rect(109, 121, 1, 1, 3); rect(108, 120, 1, 1, 3);
    }
    // turn counter and modes, between the two sides
    const tcount = th.turns.length;
    text(`TURN ${Math.max(0, Math.min(shown + 1, tcount))}/${tcount}`, 8, 54, 2);
    if (LIVE) { rect(7, 65, 34, 10, 2); text('LIVE', 8, 66, 0); }
    if (auto) { rect(LIVE ? 47 : 7, 65, 34, 10, 3); text('AUTO', LIVE ? 48 : 8, 66, 0); }
    // dialog
    frame(0, 136, W, 56);
    const b = boxes[bi], n = Math.floor(typed);
    text(b.lines[0].slice(0, n), 12, 148);
    text(b.lines[1].slice(0, Math.max(0, n - b.lines[0].length)), 12, 168);
    if (typed >= boxLen(b) && bi < boxes.length - 1 && Math.floor(now / 400) % 2) text('\x02', 236, 178);
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(100, now - last); last = now;
    if (mode === 'battle' && th) {
      const len = boxLen(boxes[bi]);
      if (typed < len) { typed = Math.min(len, typed + dt * 0.06); if (typed >= len) doneAt = now; }
      else if (auto && bi < boxes.length - 1 && now - doneAt > 1000 + len * 25) go(bi + 1, now, false);
      drawBattle(now);
    } else drawMenu(now);
    requestAnimationFrame(tick);
  }

  // ---------- transcript ----------
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function link(href, txt) {
    const a = el('a', null, txt);
    if (/^https:\/\/github\.com\//.test(href || '')) { a.href = href; a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }
  function renderLog() {
    logEl.replaceChildren();
    if (mode === 'menu' || !th) {
      logEl.append(el('h2', null, 'Conversations'));
      threads.forEach((t, i) => {
        const d = el('div', 'turn' + (i === sel ? ' active' : ''));
        const who = el('div', 'who', `${t.label} `); who.append(el('span', null, `${t.state} · ${t.turns.length} turns · ${t.repo}`));
        d.append(who, el('div', null, t.title), link(t.url, t.url));
        d.onclick = e => { if (e.target.tagName !== 'A') openThread(i); };
        logEl.append(d);
      });
      return;
    }
    logEl.append(el('h2', null, `${th.label} · ${th.state} · ${th.repo}`));
    const title = el('p', 'title'); title.append(link(th.url, th.title || th.url)); logEl.append(title);
    th.turns.forEach((v, i) => {
      const d = el('div', 'turn'); d.dataset.turn = i;
      const who = el('div', 'who', v.voice + ' ');
      who.append(el('span', null, `${(v.time || '').slice(11, 16)}${v.head ? ' @ ' + v.head : ''} `), link(v.html_url, '#' + v.id));
      const ul = el('ul'); (v.gist || []).forEach(line => ul.append(el('li', null, line)));
      d.append(who, ul);
      d.onclick = e => { if (e.target.tagName !== 'A') go(firstBoxOf(i), performance.now(), false); };
      logEl.append(d);
    });
    if (!th.turns.length) logEl.append(el('p', 'title', 'No bot turns yet.'));
    highlight();
  }
  function highlight() {
    if (mode !== 'battle') return;
    logEl.querySelectorAll('.turn.active').forEach(e => e.classList.remove('active'));
    const cur = logEl.querySelector(`.turn[data-turn="${Math.min(shown, th.turns.length - 1)}"]`);
    if (!cur) return;
    cur.classList.add('active');
    if (cur.offsetTop < logEl.scrollTop || cur.offsetTop + cur.offsetHeight > logEl.scrollTop + logEl.clientHeight)
      logEl.scrollTop = cur.offsetTop - 8;
  }
  function setStatus(extra) {
    const when = new Date(updated).toLocaleTimeString();
    statusEl.textContent = (LIVE ? `live · updated ${when} · polls every 15 s` : `snapshot of ${when}`) + (extra ? ` · ${extra}` : '') +
      ((data.errors || []).length ? ` · ${data.errors.length} thread(s) failed to load` : '');
  }

  // ---------- live updates ----------
  function boxKey(t, bx, i) {
    const tu = bx[i].turn;
    const key = tu < 0 ? 'intro' : tu >= t.turns.length ? 'outro' : t.turns[tu].id;
    let ord = 0;
    for (let j = i - 1; j >= 0 && bx[j].turn === tu; j--) ord++;
    return [key, ord];
  }
  function apply(next) {
    data.errors = next.errors; updated = next.generated;
    const was = th, wasMenu = mode === 'menu';
    threads = next.threads;
    if (was) {
      const i = threads.findIndex(t => t.url === was.url);
      if (i < 0) { threads = [was, ...threads]; sel = 0; return; }
      const [key, ord] = boxKey(was, boxes, bi), oldTurns = was.turns.length, wasTyped = typed;
      th = threads[i]; sel = i;
      const changed = th.turns.length !== oldTurns || JSON.stringify(th.turns.map(v => v.lines)) !== JSON.stringify(was.turns.map(v => v.lines));
      boxes = buildBoxes(th);
      let at;
      if (key === 'outro' && th.turns.length > oldTurns) at = firstBoxOf(oldTurns);
      else {
        const turnIdx = key === 'intro' ? -1 : key === 'outro' ? th.turns.length : th.turns.findIndex(v => v.id === key);
        const first = firstBoxOf(turnIdx);
        at = first < 0 ? Math.min(bi, boxes.length - 1) : Math.min(first + ord, boxes.length - 1);
      }
      const now = performance.now();
      if (at !== bi || changed) { bi = at; typed = key === 'outro' && th.turns.length > oldTurns ? 0 : Math.min(wasTyped, boxLen(boxes[bi])); shown = -3; onBox(now); }
      if (changed) renderLog();
    } else if (wasMenu) { sel = Math.min(sel, Math.max(0, threads.length - 1)); renderLog(); }
  }
  async function poll() {
    try {
      const r = await fetch('/api/threads', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      apply(await r.json()); setStatus();
    } catch (err) { setStatus('poll failed: ' + err.message); }
  }

  // ---------- input and layout ----------
  window.addEventListener('keydown', e => {
    const now = performance.now(), k = e.key;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    let used = true;
    if (k === 'Enter' || k === ' ' || k === 'z' || k === 'Z' || k === 'ArrowRight') advance(now);
    else if (k === 'Backspace' || k === 'b' || k === 'B' || k === 'x' || k === 'X' || k === 'ArrowLeft') back(now);
    else if (k === 'a' || k === 'A') auto = !auto;
    else if (k === 'Escape') toMenu();
    else if (k === 'l' || k === 'L' || k === 'End') jumpLatest(now);
    else if (k === 'Home') { if (mode === 'battle') go(0, now, false); }
    else if (mode === 'menu' && k === 'ArrowDown') { sel = Math.min(threads.length - 1, sel + 1); renderLog(); }
    else if (mode === 'menu' && k === 'ArrowUp') { sel = Math.max(0, sel - 1); renderLog(); }
    else used = false;
    if (used) e.preventDefault();
  });
  cv.addEventListener('click', e => {
    const now = performance.now();
    cv.focus();
    if (mode === 'menu') {
      const y = e.offsetY / cv.clientHeight * H, row = Math.floor((y - 30) / 24);
      if (y >= 30 && y < 126 && top + row < threads.length) {
        if (top + row === sel) openThread(sel); else { sel = top + row; renderLog(); }
      }
    } else advance(now);
  });
  function fit() {
    const dpr = window.devicePixelRatio || 1, wide = innerWidth >= 1040;
    const availW = wide ? innerWidth - 32 - 20 - 400 : innerWidth - 32, availH = innerHeight - 90;
    const s = Math.max(1, Math.floor(Math.min(availW / W, availH / H) * dpr));
    cv.style.width = (W * s / dpr) + 'px'; cv.style.height = (H * s / dpr) + 'px';
    logEl.style.height = wide ? (H * s / dpr) + 'px' : '';
  }
  window.addEventListener('resize', fit);
  fit();
  if (threads.length === 1) openThread(0); else renderLog();
  setStatus();
  if (LIVE) setInterval(poll, 15000);
  requestAnimationFrame(tick);
  cv.focus();
})();
</script>
</body>
</html>
