# deep-mode PR security gate: Cloudflare's security-audit skill, scoped to each PR's diff.
# Install per references/techniques/security-audit.md. Copy to .github/workflows/security-audit.yml
# and copy prompt.md and gate.cjs to .github/security-audit/.
name: security-audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SKILL_REPO: https://github.com/cloudflare/security-audit-skill
  SKILL_SHA: c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
  AUDIT_MODEL: sonnet
  AUDIT_AGENTS: "12"
  AUDIT_BUDGET_USD: "8"
  FAIL_AT: high
  BLOCK_ON_UNVALIDATED: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret (fork PRs get none). Skipping the audit."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Audit the PR
        if: steps.creds.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git clone --quiet --filter=blob:none "$SKILL_REPO" "$RUNNER_TEMP/skill"
          git -C "$RUNNER_TEMP/skill" checkout --quiet "$SKILL_SHA"
          SKILL="$RUNNER_TEMP/skill/skills/security-audit"
          OUT="$RUNNER_TEMP/audit"
          mkdir -p "$OUT"
          # The base branch's prompt, so a PR can't rewrite the audit it is judged by.
          git show "$BASE_SHA:.github/security-audit/prompt.md" > "$RUNNER_TEMP/prompt.md" 2>/dev/null \
            || git show "HEAD:.github/security-audit/prompt.md" > "$RUNNER_TEMP/prompt.md"
          sed -i -e "s|{{SKILL}}|$SKILL|g" -e "s|{{OUT}}|$OUT|g" -e "s|{{BASE}}|$BASE_SHA|g" \
            -e "s|{{HEAD}}|$HEAD_SHA|g" -e "s|{{AGENTS}}|$AUDIT_AGENTS|g" "$RUNNER_TEMP/prompt.md"
          npm install --global --silent @anthropic-ai/claude-code
          claude -p --model "$AUDIT_MODEL" --output-format json --permission-mode dontAsk \
            --allowedTools "Read,Grep,Glob,Write,Edit,Task,TodoWrite,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(node $SKILL/validate-findings.cjs:*),Bash(node $SKILL/validate-coverage-ledger.cjs:*)" \
            --disallowedTools "WebFetch,WebSearch" \
            --add-dir "$RUNNER_TEMP" --max-budget-usd "$AUDIT_BUDGET_USD" \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/claude.json" \
            || echo "::warning::The audit agent exited non-zero; the gate decides from its output."
          jq -r '"cost $\(.total_cost_usd): \(.result // "")"' "$RUNNER_TEMP/claude.json" || true

      - name: Gate and comment
        if: always() && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The agent could write to $RUNNER_TEMP, so restore the pinned skill and read the gate
          # from git, never from a file the agent could have touched.
          git -C "$RUNNER_TEMP/skill" reset --quiet --hard "$SKILL_SHA"
          git -C "$RUNNER_TEMP/skill" clean -fdxq
          git show "$BASE_SHA:.github/security-audit/gate.cjs" > "$RUNNER_TEMP/gate.cjs" 2>/dev/null \
            || git show "HEAD:.github/security-audit/gate.cjs" > "$RUNNER_TEMP/gate.cjs"
          # Accepted findings come from the PR's committed head, so every acceptance shows in its diff.
          git show "HEAD:.github/security-audit/accepted.txt" > "$RUNNER_TEMP/accepted.txt" 2>/dev/null || : > "$RUNNER_TEMP/accepted.txt"
          set +e
          node "$RUNNER_TEMP/gate.cjs" "$RUNNER_TEMP/audit" "$RUNNER_TEMP/skill/skills/security-audit" \
            "$FAIL_AT" "$BLOCK_ON_UNVALIDATED" "$RUNNER_TEMP/accepted.txt" > "$RUNNER_TEMP/comment.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- deep-mode-security-audit -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
          exit $code
