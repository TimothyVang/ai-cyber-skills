# deep-mode PR security gate: Cloudflare's security-audit skill, scoped to each PR's diff.
# Install per references/techniques/security-audit.md. Copy to .github/workflows/security-audit.yml
# and copy prompt.md and gate.cjs to .github/security-audit/.
name: security-audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SKILL_REPO: https://github.com/cloudflare/security-audit-skill
  SKILL_SHA: c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
  AUDIT_MODEL: sonnet
  AUDIT_AGENTS: "12"
  AUDIT_BUDGET_USD: "8"
  FAIL_AT: high
  BLOCK_ON_UNVALIDATED: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret (fork PRs get none). Skipping the audit."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Audit the PR
        if: steps.creds.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git clone --quiet --filter=blob:none "$SKILL_REPO" "$RUNNER_TEMP/skill"
          git -C "$RUNNER_TEMP/skill" checkout --quiet "$SKILL_SHA"
          SKILL="$RUNNER_TEMP/skill/skills/security-audit"
          OUT="$RUNNER_TEMP/audit"
          mkdir -p "$OUT"
          # Prompt, gate, and acceptances come only from the base branch: a PR can't vouch for itself.
          if ! git show "$BASE_SHA:.github/security-audit/prompt.md" > "$RUNNER_TEMP/prompt.md" 2>/dev/null; then
            echo "::error::.github/security-audit/ is not on the base branch yet. Merge the PR that installs it first."
            exit 1
          fi
          # The diff is computed here, not by the agent: git's --output flag would let a Bash git
          # permission write files anywhere. --text and --no-textconv stop the PR's
          # .gitattributes from hiding changed lines as "binary".
          git diff --no-ext-diff --no-textconv --text "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.files"
          sed -i -e "s|{{SKILL}}|$SKILL|g" -e "s|{{OUT}}|$OUT|g" -e "s|{{BASE}}|$BASE_SHA|g" \
            -e "s|{{HEAD}}|$HEAD_SHA|g" -e "s|{{AGENTS}}|$AUDIT_AGENTS|g" -e "s|{{TARGET}}|$GITHUB_WORKSPACE|g" \
            -e "s|{{DIFF}}|$RUNNER_TEMP/pr.diff|g" -e "s|{{FILES}}|$RUNNER_TEMP/pr.files|g" "$RUNNER_TEMP/prompt.md"
          npm install --global --silent @anthropic-ai/claude-code
          # Run from an empty folder with user settings only, no hooks, and no MCP servers, so the
          # PR's .claude/ settings, hooks, .mcp.json, and CLAUDE.md never load. Reads are limited to
          # the checkout and $RUNNER_TEMP (not /proc, where the step's secrets live).
          mkdir -p "$RUNNER_TEMP/agent-cwd"
          cd "$RUNNER_TEMP/agent-cwd"
          W="$GITHUB_WORKSPACE"
          T="$RUNNER_TEMP"
          READS="Read(/$W/**),Grep(/$W/**),Glob(/$W/**),Read(/$T/**),Grep(/$T/**),Glob(/$T/**)"
          claude -p --model "$AUDIT_MODEL" --output-format json --permission-mode dontAsk \
            --setting-sources user --settings '{"disableAllHooks": true}' --strict-mcp-config \
            --allowedTools "$READS,Write(/$OUT/**),Edit(/$OUT/**),Task,TodoWrite,Bash(node $SKILL/validate-findings.cjs:*),Bash(node $SKILL/validate-coverage-ledger.cjs:*)" \
            --disallowedTools "WebFetch,WebSearch" \
            --add-dir "$W" --add-dir "$T" --max-budget-usd "$AUDIT_BUDGET_USD" \
            < "$T/prompt.md" > "$T/claude.json" \
            || echo "::warning::The audit agent exited non-zero; the gate decides from its output."
          jq -r '"cost $\(.total_cost_usd): \(.result // "")"' "$T/claude.json" || true

      - name: Gate and comment
        if: always() && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Only to scrub them from the comment, in case a steered agent copied one into a finding.
          REDACT_1: ${{ secrets.ANTHROPIC_API_KEY }}
          REDACT_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # The agent could write to $RUNNER_TEMP, so restore the pinned skill and read the gate
          # from the base branch, never from a file the agent or the PR could have touched.
          if [ -d "$RUNNER_TEMP/skill" ]; then
            git -C "$RUNNER_TEMP/skill" reset --quiet --hard "$SKILL_SHA"
            git -C "$RUNNER_TEMP/skill" clean -fdxq
          fi
          if git show "$BASE_SHA:.github/security-audit/gate.cjs" > "$RUNNER_TEMP/gate.cjs" 2>/dev/null; then
            git show "$BASE_SHA:.github/security-audit/accepted.txt" > "$RUNNER_TEMP/accepted.txt" 2>/dev/null \
              || : > "$RUNNER_TEMP/accepted.txt"
            set +e
            node "$RUNNER_TEMP/gate.cjs" "$RUNNER_TEMP/audit" "$RUNNER_TEMP/skill/skills/security-audit" \
              "$FAIL_AT" "$BLOCK_ON_UNVALIDATED" "$RUNNER_TEMP/accepted.txt" > "$RUNNER_TEMP/comment.md"
            code=$?
            set -e
          else
            printf '%s\n' '<!-- deep-mode-security-audit -->' '## Security audit' '' \
              '**Blocked:** the gate is not on the base branch yet. Merge the PR that installs `.github/security-audit/` first; a PR is never judged by a gate it brings itself.' \
              > "$RUNNER_TEMP/comment.md"
            code=1
          fi
          node -e 'const fs = require("fs"); const f = process.argv[1]; let t = fs.readFileSync(f, "utf8");
            for (const v of [process.env.REDACT_1, process.env.REDACT_2]) if (v) t = t.split(v).join("[redacted]");
            fs.writeFileSync(f, t);' "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- deep-mode-security-audit -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
          exit $code
