name: trending
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - plugins/deep-mode/skills/deep-mode/scripts/trending.py
      - .github/workflows/trending.yml
permissions:
  contents: write
concurrency:
  group: trending-${{ github.ref }}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python plugins/deep-mode/skills/deep-mode/scripts/trending.py update
      - run: python scripts/check.py
      - name: Commit the refreshed catalog to main
        if: github.ref == 'refs/heads/main'
        run: |
          dir=plugins/deep-mode/skills/deep-mode/references/trending
          if [ -z "$(git status --porcelain -- "$dir")" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dir"
          git commit -m "chore(trending): refresh catalog $(date -u +%F)"
          git pull --rebase
          git push
