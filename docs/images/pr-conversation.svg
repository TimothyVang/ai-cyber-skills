<text x="260" y="524" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fbbf24" text-anchor="start">loop 3-4: re-review each new head until no P0 or P1 is open (maxRounds 3)</text>
<circle cx="34" cy="579" r="13" fill="#38bdf8"/><text x="34" y="584" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">6</text>
<line x1="360" y1="584" x2="1070" y2="584" stroke="#9fb0c8" stroke-width="2" marker-end="url(#ah)"/>
<text x="715.0" y="575" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">run the change at the final head, vote</text>
<line x1="1070" y1="626" x2="360" y2="626" stroke="#fbbf24" stroke-width="2" marker-end="url(#ahA)"/>
<text x="715.0" y="617" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">three sealed votes: PASS / FAIL + evidence</text>
