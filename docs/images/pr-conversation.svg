<circle cx="120" cy="640" r="5.5" fill="#a78bfa"/>
<text x="140" y="662" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#a78bfa" text-anchor="start">votes, then the tally (2 of 3 PASS)</text>
<circle cx="34" cy="707" r="13" fill="#38bdf8"/><text x="34" y="712" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">7</text>
<rect x="405" y="690" width="460" height="196" rx="14" fill="#111b2f" stroke="#fbbf24" stroke-width="1.6"/>
<text x="425" y="720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="start">Merge gate (enforced in code)</text>
<path d="M429 747 l5 5 l10 -11" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="453" y="752" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start">same head the panel voted on</text>
<path d="M429 773 l5 5 l10 -11" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="453" y="778" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start">every required check reported and green</text>
<path d="M429 799 l5 5 l10 -11" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="453" y="804" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start">not conflicting with the base</text>
<path d="M429 825 l5 5 l10 -11" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="453" y="830" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start">your own PR: your commits, no fork</text>
<path d="M429 851 l5 5 l10 -11" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="453" y="856" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e6edf3" text-anchor="start">merge authorized (autonomousMerge, base branch)</text>
<line x1="360" y1="700" x2="360" y2="860" stroke="#38bdf8" stroke-width="2" marker-end="url(#ahS)"/>
<line x1="360" y1="878" x2="128" y2="878" stroke="#a78bfa" stroke-width="2" marker-end="url(#ahV)"/>
<text x="244" y="868" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e6edf3" text-anchor="middle">squash merge at that sha</text>
<rect x="40" y="862" width="80" height="32" rx="16" fill="#8957e5"/><text x="80" y="883" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Merged</text>
<text x="885" y="730" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Not a pass, or a gate fails:</text>
<text x="885" y="754" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start">back to step 4 with the failures,</text>
<text x="885" y="776" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start">or stop at merge-ready and say why.</text>
<text x="885" y="812" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Others' PRs and forks:</text>
<text x="885" y="836" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start">review comments only. Never merged.</text>
