<text x="240.0" y="201" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">kickoff: goal, acceptance, head sha</text>
<circle cx="34" cy="257" r="13" fill="#38bdf8"/><text x="34" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">2</text>
