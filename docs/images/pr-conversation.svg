<line x1="360" y1="330" x2="840" y2="330" stroke="#9fb0c8" stroke-width="2" marker-end="url(#ah)"/>
<text x="600.0" y="321" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">review the diff at this head</text>
<line x1="840" y1="372" x2="360" y2="372" stroke="#34d399" stroke-width="2" stroke-dasharray="0" marker-end="url(#ah)"/>
<text x="600.0" y="363" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">findings JSON: P0 / P1 / P2, with evidence</text>
