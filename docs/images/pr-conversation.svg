<circle cx="120" cy="386" r="5.5" fill="#a78bfa"/>
<circle cx="34" cy="425" r="13" fill="#38bdf8"/><text x="34" y="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#0b1220" text-anchor="middle">4</text>
<line x1="360" y1="430" x2="600" y2="430" stroke="#9fb0c8" stroke-width="2" marker-end="url(#ah)"/>
<text x="480.0" y="421" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">answer every finding</text>
<line x1="600" y1="472" x2="360" y2="472" stroke="#f08a5d" stroke-width="2" stroke-dasharray="0" marker-end="url(#ah)"/>
<text x="480.0" y="463" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#e6edf3" text-anchor="middle">fixed (new sha) or dismissed (with proof)</text>
<line x1="120" y1="486" x2="600" y2="486" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.8"/>
<circle cx="120" cy="486" r="5.5" fill="#a78bfa"/>
<rect x="250" y="300" width="700" height="196" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="5 5"/>
