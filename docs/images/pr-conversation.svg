<text x="1070" y="159" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#fbbf24" text-anchor="middle">one-shot, own worktree</text>
