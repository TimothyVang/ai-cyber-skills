<text x="760" y="183" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#fbbf24" text-anchor="start">acme-review-&lt;login&gt;[bot]</text>
<rect x="530" y="204" width="630" height="38" rx="12" fill="#111b2f" stroke="#2a3a5c" stroke-width="1.2"/>
<text x="552" y="229" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fb0c8" text-anchor="start">Comment signature</text>
<text x="760" y="229" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#e6edf3" text-anchor="start">**acme-review reviewer · omp**</text>
<rect x="530" y="250" width="630" height="38" rx="12" fill="#111b2f" stroke="#2a3a5c" stroke-width="1.2"/>
<text x="552" y="275" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fb0c8" text-anchor="start">Mention</text>
<text x="760" y="275" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#e6edf3" text-anchor="start">@acme-review implement</text>
<rect x="530" y="296" width="630" height="38" rx="12" fill="#111b2f" stroke="#2a3a5c" stroke-width="1.2"/>
<text x="552" y="321" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fb0c8" text-anchor="start">Issue branches</text>
<text x="760" y="321" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#e6edf3" text-anchor="start">acme-review/issue-&lt;n&gt;</text>
<rect x="530" y="342" width="630" height="38" rx="12" fill="#111b2f" stroke="#2a3a5c" stroke-width="1.2"/>
<text x="552" y="367" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fb0c8" text-anchor="start">Repo opt-out file</text>
<text x="760" y="367" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#e6edf3" text-anchor="start">.acme-review.json</text>
<rect x="530" y="388" width="630" height="38" rx="12" fill="#111b2f" stroke="#2a3a5c" stroke-width="1.2"/>
<text x="552" y="413" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fb0c8" text-anchor="start">Config and state</text>
<text x="760" y="413" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#e6edf3" text-anchor="start">~/.config/acme-review/</text>
<rect x="530" y="434" width="630" height="38" rx="12" fill="#111b2f" stroke="#2a3a5c" stroke-width="1.2"/>
<text x="552" y="459" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#9fb0c8" text-anchor="start">Autostart task</text>
<text x="760" y="459" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.5" font-weight="500" fill="#e6edf3" text-anchor="start">acme-review-bot</text>
<text x="40" y="524" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Stays the same:</text>
<text x="160" y="524" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">the gates, the panel, the agents and their logins, the skill and its commands.</text>
<text x="40" y="552" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c8" text-anchor="start">Only "name" is required. description, homepage and the rest can be set too; missing keys derive from name.</text>
